name: Build and Release Docker Images

on:
    release:
        types:
            - published

jobs:
    build-and-push:
        name: ${{ matrix.service }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        strategy:
            fail-fast: false
            matrix:
                include:
                    - service: provenance-api
                      context: api
                      dockerfile: api/docker/prod.Dockerfile
                    - service: provenance-ui
                      context: ui
                      dockerfile: ui/docker/prod.Dockerfile

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # Runtime stages use Docker Hardened Images (dhi.io).
            - name: Log in to dhi.io
              uses: docker/login-action@v3
              with:
                  registry: dhi.io
                  username: ${{ secrets.DHI_USERNAME }}
                  password: ${{ secrets.DHI_PATOKEN }}

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract image metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
                  # latest only for stable releases, not pre-releases (e.g. v1.0.0-rc.1).
                  flavor: |
                      latest=false
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}},enable=${{ !startsWith(github.event.release.tag_name, 'v0.') }}
                      type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: ${{ matrix.context }}
                  file: ${{ matrix.dockerfile }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.service }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.service }}
